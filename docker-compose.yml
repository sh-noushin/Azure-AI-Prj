# Run the whole app with:  docker compose up
#
# Nothing needs to be installed except Docker: the images bring .NET and Node
# with them. Copy .env.example to .env and fill in your Azure values first.

services:
  api:
    build: ./api
    environment:
      # Double underscore is how Docker passes a nested setting to .NET:
      # AzureAi__ApiKey becomes the "AzureAi:ApiKey" setting.
      AzureAi__OpenAiEndpoint: ${AZURE_OPENAI_ENDPOINT}
      AzureAi__ServicesEndpoint: ${AZURE_SERVICES_ENDPOINT}
      AzureAi__Region: ${AZURE_REGION}
      AzureAi__ChatDeployment: ${AZURE_CHAT_DEPLOYMENT:-gpt-5-mini}
      AzureAi__EmbeddingDeployment: ${AZURE_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      AzureAi__ApiKey: ${AZURE_AI_KEY}
    restart: unless-stopped

  web:
    build: ./web
    ports:
      # Same port as the dev server, so the URL is the same either way.
      # Override with WEB_PORT in .env if something else uses it.
      - "${WEB_PORT:-4300}:80"
    depends_on:
      - api
    restart: unless-stopped
