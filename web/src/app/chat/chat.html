<app-feature-card
  title="Chat"
  hint="Stellen Sie eine Frage an das Modell gpt-5-mini.">

  <textarea
    rows="3"
    placeholder="Was ist eine digitale Signatur?"
    [(ngModel)]="question"
    (keydown.control.enter)="ask()"></textarea>

  <button (click)="ask()" [disabled]="loading() || !question().trim()">
    {{ loading() ? 'Einen Moment …' : 'Fragen' }}
  </button>

  <app-error-message [message]="error()" />
  <app-answer-box [text]="answer()" />
</app-feature-card>
